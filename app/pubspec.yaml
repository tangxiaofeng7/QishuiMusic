name: qishui_player
description: "汽水播放器（QishuiMusic）：多平台音源音乐播放器（iOS / Android）"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # FFI 基础（Utf8 分配/转换）
  ffi: ^2.1.0
  # 播放（本地解密后的 m4a/flac）与后台播放 / 锁屏控制
  just_audio: ^0.10.0
  audio_service: ^0.18.19
  # 扫码登录的二维码渲染
  qr_flutter: ^4.1.0
  # 内置签名页：隐藏 WebView 跑官方安全组件（a_bogus 网页签名）
  webview_flutter: ^4.10.0
  webview_flutter_wkwebview: ^3.17.0
  # 设置与缓存目录
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  # 播放页壁纸（从系统相册选图，iOS 14+ 走 PHPicker 免权限）
  image_picker: ^1.1.2
  # 设置备份导出（系统分享面板）
  share_plus: ^10.1.2
  # 逐字歌词按字计数（CJK 字素）
  characters: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # 2.4+ 重写为 objective_c（Dart FFI 原生资产，运行时 dlopen）——
  # 越狱伪签环境下 dlopen 会被 AMFI 拒绝；钉回 MethodChannel 版本根除。
  # iOS 侧我们已不直接使用 path_provider（见 store.dart 的 TMPDIR 推导）。
  path_provider_foundation: 2.3.2

flutter:
  uses-material-design: true
  assets:
    # 内置签名页（扫码登录的 a_bogus 网页签名；官方安全组件快照）
    - assets/signer/
    - assets/lx/
    - assets/lx-sources/
    # 开源许可证全文（设置 → 开源许可证）
    - assets/licenses/
