<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>身份验证</title>
    <!--
      App 内置二次验证窗口（check_qrconnect 返回 error_code=2046 时弹出）。

      架构对齐桌面版：本页是「可见」的 WebView（不受 iOS 后台定时器节流），
      自带 bdms 签名组件——验证组件的网络请求在本页直接签名并发起，经
      与 host.html 相同的 XHR open 改写器落到同源中继（无 CORS、无跨页
      桥接）。此前经隐藏签名页代发的方案被 iOS 对离屏 WebView 的 JS
      节流拖垮（bdms 高危签名是多步异步，每步被节流 30s+）。

      流程：/verify/start 取决策 → 渲染官方 ucWebSecondVerify 组件 →
      完成后 /verify/complete 回执 → 跳 /verify/done 让原生侧关窗。
    -->
    <script>
      (function () {
        'use strict';
        // 与 host.html 相同的改写器：白名单域的 XHR 落到同源中继，
        // bdms 在外层看到真实 URL 并按它签名（改写不影响签名有效性）。
        var allowedHosts = [
          'api.qishui.com', 'www.qishui.com', 'bff-pc.qishui.com',
          'auth.zijieapi.com', 'mcs.zijieapi.com', 'mon.zijieapi.com',
          'sso.douyin.com', 'www.douyin.com', 'qishui.douyin.com',
          'aweme.snssdk.com', 'lf-headquarters-speed.yhgfb-cn-static.com',
          'lf-c-flwb.bytetos.com',
        ];
        var nativeOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url) {
          this.__sodamRequestMethod = String(method || 'GET').toUpperCase();
          this.__sodamRequestUrl = String(url || '');
          try {
            var u = new URL(String(url), location.href);
            if ((u.protocol === 'https:' || u.protocol === 'http:') &&
                allowedHosts.indexOf(u.host) !== -1) {
              var sep = u.search ? '&' : '?';
              var relay = u.pathname + u.search + sep +
                  '__sodam_host=' + encodeURIComponent(u.host);
              var args = [method, relay];
              for (var i = 2; i < arguments.length; i++) args.push(arguments[i]);
              return nativeOpen.apply(this, args);
            }
          } catch (e) {}
          return nativeOpen.apply(this, arguments);
        };

        // 请求观测（只记 method+host+path，用改写器安装前的原生 fetch，
        // 且本机路径不上报——防自激洪水）。
        var rawFetch = window.fetch.bind(window);
        var nativeSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.send = function () {
          try {
            var u = new URL(this.__sodamRequestUrl || '', location.href);
            if (u.hostname !== '127.0.0.1' && u.hostname !== 'localhost') {
              logVerifyRequest('xhr', this.__sodamRequestMethod, u.hostname, u.pathname);
            }
          } catch (e) {}
          return nativeSend.apply(this, arguments);
        };

        function logVerifyRequest(kind, method, host, path) {
          try {
            rawFetch(location.origin + '/verify/log', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ kind: kind, method: method || 'GET', host: host, path: path }),
            }).catch(function () {});
          } catch (e) {}
        }

        // fetch 改写：白名单域翻译成同源中继路径（fetch 的 URL 无法在
        // open 层改，只能整体换 URL；无需 bdms 签名的监控/静态类请求）。
        window.fetch = function (input, init) {
          try {
            var url = typeof input === 'string' ? input : (input && input.url) || String(input);
            var u = new URL(url, location.href);
            if (u.protocol !== 'http:' && u.protocol !== 'https:') {
              return rawFetch(input, init);
            }
            if (allowedHosts.indexOf(u.host) !== -1) {
              var sep = u.search ? '&' : '?';
              var relay = u.pathname + u.search + sep +
                  '__sodam_host=' + encodeURIComponent(u.host);
              if (typeof input === 'string') return rawFetch(relay, init);
              return rawFetch(new Request(relay, input), init);
            }
          } catch (e) {}
          return rawFetch(input, init);
        };
      })();
    </script>
    <script src="react.js"></script>
    <script src="react-dom.js"></script>
    <script>
      window.ucSecondVerifyReact = window.React;
      window.ucSecondVerifyReactDom = window.ReactDOM;
    </script>
    <script src="sdk-glue.js"></script>
    <script>
      window._SdkGlueInit({
        self: { aid: 386088, pageId: 24554 },
        bdms: { aid: 386088, paths: ['/passport'] },
      });
      // bdms 走官方 CDN；8s 未就绪则注入本地快照兜底（与 host.html 一致）。
      var fallbackTimer = setTimeout(function () {
        if (!window.bdms) {
          var s = document.createElement('script');
          s.src = '/bdms.js';
          s.onload = function () {
            try { window.bdms.init({ aid: 386088, paths: ['/passport'] }); } catch (e) {}
          };
          document.head.appendChild(s);
        }
      }, 8000);
    </script>
    <script>
      (function () {
        'use strict';
        var verifyKey = '';
        try {
          verifyKey = new URL(location.href).searchParams.get('key') ||
              new URL(location.href).searchParams.get('token') || '';
        } catch (e) {}

        function waitForBdms(timeoutMs) {
          return new Promise(function (resolve) {
            var started = Date.now();
            var timer = setInterval(function () {
              if (window.bdms || Date.now() - started > (timeoutMs || 15000)) {
                clearInterval(timer);
                resolve(!!window.bdms);
              }
            }, 200);
          });
        }

        function xor5Hex(value) {
          var bytes = new TextEncoder().encode(String(value));
          var result = '';
          for (var i = 0; i < bytes.length; i++) result += (bytes[i] ^ 5).toString(16);
          return result;
        }

        function storageStatus() {
          var size = 0;
          try {
            for (var key in localStorage) {
              if (Object.prototype.hasOwnProperty.call(localStorage, key)) {
                size += localStorage[key].length;
              }
            }
          } catch (e) { size = -1; }
          return {
            indexedDB: {
              idb: typeof indexedDB, open: indexedDB && typeof indexedDB.open,
              openDatabase: typeof window.openDatabase,
              isSafari: false,
              hasFetch: typeof fetch === 'function' && fetch.toString().indexOf('[native code') !== -1,
            },
            localStorage: { isSupportLStorage: true, size: size, write: true },
            storageQuotaStatus: { usage: 0, quota: 0, isPrivate: false },
          };
        }

        function webglInfo() {
          try {
            var canvas = document.createElement('canvas');
            var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            var debug = gl && gl.getExtension('WEBGL_debug_renderer_info');
            return {
              vendor: gl && gl.getParameter(debug && debug.UNMASKED_VENDOR_WEBGL),
              renderer: gl && gl.getParameter(debug && debug.UNMASKED_RENDERER_WEBGL),
            };
          } catch (e) { return {}; }
        }

        window.__qishuiBrowserInfo = async function () {
          var info = {
            hardwareConcurrency: navigator.hardwareConcurrency,
            webdriver: Boolean(navigator.webdriver || /headless/i.test(navigator.userAgent)),
            chromedriver: false,
            shelldriver: false,
            plugins: navigator.plugins ? navigator.plugins.length : 0,
            permissions: [],
            innerHeight: window.innerHeight,
            innerWidth: window.innerWidth,
            outerHeight: window.outerHeight,
            outerWidth: window.outerWidth,
            stoargeStatus: storageStatus(),
            webgl: webglInfo(),
            notificationPermission: window.Notification ? Notification.permission : 'none',
            performance: {
              timeOrigin: performance.timeOrigin,
              usedJSHeapSize: performance.memory ? performance.memory.usedJSHeapSize : 'unsupport',
              navigationTiming: { name: location.href, entryType: 'navigate' },
            },
            request_host: 'resources',
            request_pathname: '/main.asar/main.html',
            browser: { t: String(Date.now()).split('').reverse().join(''), bit_protocol: 'false', bit_helper: false },
          };
          return { raw: info, encrypted: xor5Hex(JSON.stringify(info)) };
        };

        // 直接请求（open 改写器自动落到同源中继；bdms 在本页签名）。
        window.__qishuiRequest = function (request) {
          return new Promise(function (resolve, reject) {
            var xhr = new XMLHttpRequest();
            xhr.open(request.method || 'GET', request.url, true);
            xhr.withCredentials = true;
            var headers = request.headers || {};
            Object.keys(headers).forEach(function (name) {
              try { xhr.setRequestHeader(name, String(headers[name])); } catch (e) {}
            });
            xhr.timeout = request.timeout || 60000;
            xhr.onload = function () {
              resolve({
                status: xhr.status,
                body: xhr.responseText,
                responseURL: xhr.responseURL,
                headers: xhr.getAllResponseHeaders(),
              });
            };
            xhr.onerror = function () { reject(new Error('XMLHttpRequest network error')); };
            xhr.ontimeout = function () { reject(new Error('XMLHttpRequest timeout')); };
            xhr.send(request.body == null ? null : request.body);
          });
        };

        function setMfaStatus(message, isError) {
          var element = document.getElementById('mfa-status');
          if (!element) return;
          element.textContent = message || '';
          element.style.color = isError ? '#d93025' : '#202124';
          element.style.display = message ? 'block' : 'none';
        }

        function normalizeObject(value) {
          if (!value) return {};
          if (typeof value === 'object') return value;
          try { return JSON.parse(String(value)); } catch (e) { return {}; }
        }

        function resolveVerifyUrl(value) {
          if (value && typeof value === 'object') {
            var host = String(value.host || '').trim();
            var path = String(value.path || '/').trim() || '/';
            if (host) return 'https://' + host + (path.charAt(0) === '/' ? path : '/' + path);
          }
          return String(value || '');
        }

        function formEncode(values) {
          var result = new URLSearchParams();
          Object.keys(values || {}).forEach(function (key) {
            var value = values[key];
            if (value == null) return;
            result.set(key, typeof value === 'object' ? JSON.stringify(value) : String(value));
          });
          return result.toString();
        }

        function loadVerifyScript(url) {
          return new Promise(function (resolve, reject) {
            var script = document.createElement('script');
            script.type = 'text/javascript';
            script.src = url;
            script.onload = resolve;
            script.onerror = function () { reject(new Error('二次验证组件加载失败：' + url)); };
            document.head.appendChild(script);
          });
        }

        function expandVerifyCenterDecision(originDecision, options) {
          if (originDecision.verify_from !== 'verify_center') return Promise.resolve(originDecision);
          var payload = Object.assign({ aid: 386088 }, originDecision, options.generalParams || {});
          delete payload.is_login;
          return window.__qishuiRequest({
            method: 'POST',
            url: 'https://api.qishui.com/passport/safe/pack_verify_ways_data/?aid=386088',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
              'x-tt-passport-verify-portrait': originDecision.verify_portrait_id || '',
            },
            body: formEncode(payload),
            timeout: 180000,
          }).then(function (response) {
            var envelope = {};
            try { envelope = JSON.parse(response.body || '{}'); } catch (e) {}
            var expanded = envelope.data || envelope;
            if (response.status < 200 || response.status >= 400 || !expanded) {
              throw new Error('获取二次验证决策失败：HTTP ' + response.status);
            }
            return Object.assign({}, originDecision, expanded);
          });
        }

        window.__qishuiSecondVerify = function (originDecision, options) {
          options = options || {};
          setMfaStatus('正在加载汽水安全验证组件…');
          var decision;
          return Promise.resolve()
            .then(function () { return expandVerifyCenterDecision(originDecision || {}, options); })
            .then(function (expanded) {
              decision = expanded;
              var verifyUrl = resolveVerifyUrl(decision.url);
              if (!verifyUrl) throw new Error('2046 决策中缺少二次验证组件 URL');
              var eventParams = normalizeObject(decision.event_params);
              var resource = new URL(verifyUrl, 'https://api.qishui.com/');
              resource.searchParams.set('aid', '386088');
              resource.searchParams.set('verify_reason', String(eventParams.verify_reason || ''));
              resource.searchParams.set('verify_scene', String(eventParams.verify_scene || ''));
              window.$$account_verify_portrait_id = decision.verify_portrait_id || '';
              if (typeof window.ucWebSecondVerify !== 'function') {
                return loadVerifyScript(resource.toString());
              }
            })
            .then(function () {
              if (typeof window.ucWebSecondVerify !== 'function') {
                throw new Error('官方二次验证组件未导出 ucWebSecondVerify');
              }
              setMfaStatus('请在窗口中完成二次验证');
              return new Promise(function (resolve) {
                var finished = false;
                var finish = function (result) {
                  if (finished) return;
                  finished = true;
                  window.__sodamMfaResolve = null;
                  var normalized = result && typeof result === 'object'
                    ? JSON.parse(JSON.stringify(result))
                    : { status: false, message: String(result || '验证未完成') };
                  resolve(normalized);
                };
                window.__sodamMfaResolve = finish;
                var eventParams = normalizeObject(decision.event_params);
                var data = Object.assign({
                  verifyFinishCallback: finish,
                  aid: 386088,
                  isNewVerifyUI: true,
                  generalParams: options.generalParams || {},
                  newSecondVerifyWebOptions: {
                    host: 'https://api.qishui.com',
                    verifyAppName: '汽水音乐移动端',
                  },
                  newSecondVerificationCall: { reportAppLog: function () {} },
                }, decision, {
                  event_params: eventParams,
                  monitorTime: {
                    startTime: Date.now(), fetchEndTime: Date.now(),
                    scriptLoadStartTime: 0, scriptLoadEndTime: Date.now(),
                    renderStartTime: Date.now(),
                  },
                  fun: decision.verify_from === 'verify_center' ? 'verify_center' : 'verify',
                  uc_account_verify_version: '1.0.29',
                });
                window.ucWebSecondVerify(data);
              });
            })
            .catch(function (error) {
              setMfaStatus(String(error && error.message ? error.message : error), true);
              throw error;
            });
        };

        window.__qishuiCancelSecondVerify = function () {
          if (window.__sodamMfaResolve) {
            window.__sodamMfaResolve({ status: false, message: '用户取消二次验证' });
          }
        };

        if (verifyKey) {
          setMfaStatus('正在初始化安全组件…');
          waitForBdms(20000).then(function (ready) {
            if (!ready) {
              throw new Error('安全组件（bdms）初始化超时');
            }
            return fetch(location.origin + '/verify/start', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ key: verifyKey }),
            });
          })
            .then(function (response) { return response.json(); })
            .then(function (result) {
              var decision = result && result.data && result.data.decision;
              if (!decision) throw new Error(result && result.error || '未获取到汽水验证决策');
              return window.__qishuiSecondVerify(decision, {
                generalParams: result.data.generalParams || decision.common_params || {},
              });
            })
            .then(function (verifyResult) {
              if (!verifyResult || verifyResult.status !== true) {
                throw new Error(verifyResult && verifyResult.message || '二次验证未完成');
              }
              setMfaStatus('验证已完成，正在提交登录结果…');
              return fetch(location.origin + '/verify/complete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: verifyKey }),
              });
            })
            .then(function (response) { return response.json(); })
            .then(function (result) {
              if (!result || result.success !== true) {
                throw new Error(result && result.error || '二次验证完成失败');
              }
              setMfaStatus('验证完成，正在返回…');
              location.href = location.origin + '/verify/done';
            })
            .catch(function (error) {
              setMfaStatus(String(error && error.message || error), true);
            });
        }
      })();
    </script>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: #fff !important; font-family: sans-serif; }
      body > div { background: #fff !important; }
      #mfa-status {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 2147483647;
        padding: 9px 14px; border-radius: 8px; background: rgba(255,255,255,.96);
        box-shadow: 0 2px 12px rgba(0,0,0,.15); max-width: 86vw; font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="mfa-status" style="display:none"></div>
  </body>
</html>
